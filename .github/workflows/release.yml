name: release

# Publishes citewatch to PyPI when a version tag is pushed (OSS-01, D-24), with PyPI trusted
# publishing: no token is stored anywhere. The owner registers this workflow once on PyPI
# (project citewatch, owner biplob819, repository ai-visibility, workflow release.yml,
# environment pypi).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: The tag matches the package version
        run: |
          version=$(uv run --no-sync python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q -m "not golden"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/citewatch/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
