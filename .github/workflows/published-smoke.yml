name: published-smoke

# OSS-02: after a release, the package as published on PyPI works with no keys on Linux, macOS
# and Windows. Runs when the release workflow finishes, or by hand with a version.

on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Version on PyPI to test (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Version under test
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          v="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a version: $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Wait for PyPI to serve it
        shell: bash
        run: |
          for i in $(seq 1 30); do
            uvx --refresh "citewatch==${VERSION}" --version && exit 0
            sleep 20
          done
          exit 1
      - name: uvx citewatch --version
        shell: bash
        run: test "$(uvx "citewatch==${VERSION}" --version)" = "citewatch ${VERSION}"
      - name: citewatch report --example (no keys)
        shell: bash
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: |
          mkdir smoke && cd smoke
          uvx "citewatch==${VERSION}" report --example
          test -s citewatch-example/index.html
