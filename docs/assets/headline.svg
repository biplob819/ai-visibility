<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 346" width="760" height="346" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">What AI search cites for UK health questions</title>
<desc id="d">Answers citing nhs.uk run 1: Claude Sonnet 5.5 10% (10/100, 95% CI 5.0% to 16%), GPT-6.1 Sol 83% (83/100, 95% CI 75% to 90%); Answers citing nhs.uk run 2: Claude Sonnet 5.5 13% (13/100, 95% CI 7.0% to 20%), GPT-6.1 Sol 84% (84/100, 95% CI 77% to 91%); Time-sensitive answers with no dated source under a year old (both runs): Claude Sonnet 5.5 12% (14/114, 95% CI 5.8% to 20%), GPT-6.1 Sol 43% (49/114, 95% CI 31% to 55%)</desc>
