seeds:
  order: 20261115
  support_sample: 51
  hand_sample: 52
  bootstrap: 53
max_cost_usd: 25          # per paid command; OWNER D-19 asks before any run above $25
user_agent: "citewatch/0.1.0 (+https://github.com/biplob819/ai-visibility)"
