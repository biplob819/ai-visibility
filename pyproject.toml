[project]
name = "citewatch"
version = "0.1.0"
description = "Measure which websites AI answers with web search cite, and how fresh those pages are."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Biplob Chakraborty" }]
requires-python = ">=3.11"
dependencies = [
    "defusedxml>=0.7",
    "duckdb>=1.1",
    "extruct>=0.17",
    "httpx>=0.28",
    "idna>=3.7",
    "numpy>=1.26",
    "protego>=0.4",
    "pydantic>=2.7",
    "python-dateutil>=2.9",
    "pyyaml>=6",
    "tldextract>=5.1",
    "typer>=0.28",  # TyperException and the exit-code behaviour cli.main relies on
]
keywords = ["llm", "web-search", "citations", "freshness", "provenance", "ai-search", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.urls]
Homepage = "https://github.com/biplob819/ai-visibility"
Issues = "https://github.com/biplob819/ai-visibility/issues"

[project.scripts]
citewatch = "citewatch.cli:entry"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1",
]
openai = [
    "openai>=2",
]
# Support check (SUP-03, D-11): EvalKit's faithfulness scorer at a pinned commit.
support = [
    "evalkit-harness @ git+https://github.com/biplob819/evalkit@43df77edb8efb07d6f168fc0f8b8544ec86e3aca",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0.12",
    "hypothesis>=6.100",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the pinned EvalKit git dependency in the `support` extra

[tool.hatch.build.targets.wheel]
packages = ["src/citewatch"]

[tool.hatch.build.targets.sdist]
include = ["src/citewatch", "README.md", "LICENSE", "changelog.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow the › separator used in proof cells

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "contract: schema, provider-format, CLI and imported-API contract tests",
    "data: frozen-data and JSONL validation tests",
    "golden: end-to-end replay of recorded responses",
    "polite: robots, rate-limit, user-agent and fetch-log rules",
    "safety: secrets, storage and demo-content tests",
    "onboarding: no-key CLI flow",
]
