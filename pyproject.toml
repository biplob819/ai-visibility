[project]
name = "ai-visibility"
version = "0.1.0"
description = "Which websites Claude and OpenAI models cite for UK health questions, and how fresh those pages are."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Biplob Chakraborty" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.scripts]
visibility = "visibility.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visibility"]

[tool.hatch.build.targets.sdist]
include = ["src/visibility", "README.md", "LICENSE", "changelog.md"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow the › separator used in proof cells

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "contract: schema, provider-format, CLI and imported-API contract tests",
    "data: frozen-data and JSONL validation tests",
    "golden: end-to-end replay of recorded responses",
    "polite: robots, rate-limit, user-agent and fetch-log rules",
    "safety: secrets, storage and demo-content tests",
    "onboarding: no-key CLI flow",
]
